<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<!-- Background gradient -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#05070a"/>
  <stop offset="50%" stop-color="#0b1117"/>
  <stop offset="100%" stop-color="#101820"/>
</linearGradient>

<!-- Neon gradient -->
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#00ff9c"/>
  <stop offset="50%" stop-color="#00d9ff"/>
  <stop offset="100%" stop-color="#00ff9c"/>
</linearGradient>

<!-- Glow -->
<filter id="glow">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Grid -->
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.035"
        stroke-width="1"/>
</pattern>

<!-- Radial glow -->
<radialGradient id="light">
  <stop offset="0%" stop-color="#00ff9c" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
</radialGradient>
```

  </defs>

  <!-- Background -->

  <rect width="1200" height="300" fill="url(#bg)"/>

  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Ambient glow -->

  <ellipse cx="930" cy="80" rx="300" ry="180" fill="url(#light)"/>

  <!-- Decorative code-like lines -->

<g opacity="0.25"
  stroke="#00ff9c"
  fill="none"
  stroke-width="1">

```
<path d="M850 45 H1080"/>
<path d="M900 65 H1150"/>
<path d="M820 85 H1010"/>

<path d="M980 210 H1160"/>
<path d="M900 230 H1080"/>
```

  </g>

  <!-- Floating particles -->

  <g fill="#00ff9c">

```
<circle cx="870" cy="125" r="2">
  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="3s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1040" cy="95" r="1.5">
  <animate attributeName="opacity"
           values="1;0.2;1"
           dur="4s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1110" cy="150" r="2">
  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="2.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="930" cy="250" r="1.5">
  <animate attributeName="opacity"
           values="1;0.2;1"
           dur="3.5s"
           repeatCount="indefinite"/>
</circle>
```

  </g>

  <!-- Main name -->

<text x="600"
     y="125"
     text-anchor="middle"
     fill="#ffffff"
     font-family="Arial, Helvetica, sans-serif"
     font-size="52"
     font-weight="700"
     letter-spacing="6">


SHYAM ANAND


  </text>

  <!-- Subtitle -->

<text x="600"
     y="165"
     text-anchor="middle"
     fill="#00ff9c"
     font-family="Arial, Helvetica, sans-serif"
     font-size="18"
     font-weight="500"
     letter-spacing="4">





  </text>

  <!-- Neon separator -->

<line x1="380"
     y1="190"
     x2="820"
     y2="190"
     stroke="url(#neon)"
     stroke-width="2"
     filter="url(#glow)">

```
<animate attributeName="x1"
         values="430;380;430"
         dur="4s"
         repeatCount="indefinite"/>

<animate attributeName="x2"
         values="770;820;770"
         dur="4s"
         repeatCount="indefinite"/>
```

  </line>

  <!-- Bottom tagline -->

<text x="600"
     y="225"
     text-anchor="middle"
     fill="#8b949e"
     font-family="monospace"
     font-size="14"
     letter-spacing="2">




  </text>

  <!-- Corner decorations -->

<g stroke="#00ff9c"
  stroke-width="2"
  fill="none"
  opacity="0.7">

```
<path d="M45 45 H85"/>
<path d="M45 45 V85"/>

<path d="M1155 215 H1115"/>
<path d="M1155 215 V175"/>
```

  </g>

  <!-- Bottom neon line -->

<rect x="0"
     y="296"
     width="1200"
     height="4"
     fill="url(#neon)">

```
<animate attributeName="opacity"
         values="0.5;1;0.5"
         dur="3s"
         repeatCount="indefinite"/>
```

  </rect>

</svg>
