<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020504"/>
      <stop offset="50%" stop-color="#06100b"/>
      <stop offset="100%" stop-color="#020504"/>
    </linearGradient>

    <!-- Green glow -->
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path
        d="M 50 0 L 0 0 0 50"
        fill="none"
        stroke="#00ff88"
        stroke-opacity="0.025"
        stroke-width="1"
      />
    </pattern>

  </defs>


  <!-- Background -->

  <rect
    width="1200"
    height="300"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="300"
    fill="url(#grid)"
  />


  <!-- MATRIX FALLING CODE -->

  <g
    font-family="monospace"
    font-size="14"
    fill="#00ff88"
    opacity="0.5"
  >

    <!-- Column 1 -->
    <text x="60" y="-20">
      01
      <animate
        attributeName="y"
        from="-100"
        to="340"
        dur="5s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 2 -->
    <text x="130" y="-80">
      &lt;/&gt;
      <animate
        attributeName="y"
        from="-150"
        to="340"
        dur="6s"
        begin="1s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 3 -->
    <text x="210" y="-40">
      101
      <animate
        attributeName="y"
        from="-120"
        to="340"
        dur="4.5s"
        begin="0.5s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 4 -->
    <text x="290" y="-100">
      &gt;_
      <animate
        attributeName="y"
        from="-180"
        to="340"
        dur="5.5s"
        begin="2s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 5 -->
    <text x="370" y="-50">
      010
      <animate
        attributeName="y"
        from="-130"
        to="340"
        dur="4s"
        begin="1.5s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 6 -->
    <text x="450" y="-120">
      { }
      <animate
        attributeName="y"
        from="-200"
        to="340"
        dur="6.5s"
        begin="0.8s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 7 -->
    <text x="520" y="-30">
      01
      <animate
        attributeName="y"
        from="-100"
        to="340"
        dur="5s"
        begin="2.5s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 8 -->
    <text x="600" y="-90">
      &lt;/&gt;
      <animate
        attributeName="y"
        from="-160"
        to="340"
        dur="4.8s"
        begin="0.3s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 9 -->
    <text x="680" y="-60">
      110
      <animate
        attributeName="y"
        from="-140"
        to="340"
        dur="5.8s"
        begin="1.2s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 10 -->
    <text x="760" y="-130">
      #
      <animate
        attributeName="y"
        from="-200"
        to="340"
        dur="4.3s"
        begin="2s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 11 -->
    <text x="840" y="-40">
      101
      <animate
        attributeName="y"
        from="-120"
        to="340"
        dur="5.2s"
        begin="0.7s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 12 -->
    <text x="920" y="-100">
      &gt;_
      <animate
        attributeName="y"
        from="-180"
        to="340"
        dur="6s"
        begin="1.8s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 13 -->
    <text x="1000" y="-70">
      { }
      <animate
        attributeName="y"
        from="-150"
        to="340"
        dur="4.7s"
        begin="0.2s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 14 -->
    <text x="1080" y="-120">
      010
      <animate
        attributeName="y"
        from="-190"
        to="340"
        dur="5.7s"
        begin="1.4s"
        repeatCount="indefinite"
      />
    </text>

    <!-- Column 15 -->
    <text x="1140" y="-30">
      01
      <animate
        attributeName="y"
        from="-100"
        to="340"
        dur="4.2s"
        begin="2.2s"
        repeatCount="indefinite"
      />
    </text>

  </g>


  <!-- DARK OVERLAY BEHIND NAME -->

  <rect
    x="250"
    y="90"
    width="700"
    height="120"
    rx="10"
    fill="#020504"
    opacity="0.72"
  />


  <!-- MAIN NAME -->

  <text
    x="600"
    y="170"
    text-anchor="middle"
    fill="#00ff88"
    font-family="Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="800"
    letter-spacing="8"
    filter="url(#textGlow)"
  >
    SHYAM ANAND

    <!-- Subtle flicker -->

    <animate
      attributeName="opacity"
      values="1;1;0.92;1;0.96;1"
      dur="4s"
      repeatCount="indefinite"
    />

  </text>


  <!-- NAME GLITCH -->

  <text
    x="603"
    y="170"
    text-anchor="middle"
    fill="#00d9ff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="800"
    letter-spacing="8"
    opacity="0.12"
  >
    SHYAM ANAND

    <animate
      attributeName="x"
      values="603;597;603;600"
      dur="3s"
      repeatCount="indefinite"
    />

  </text>


  <!-- Subtle bottom glow -->

  <rect
    x="0"
    y="298"
    width="1200"
    height="2"
    fill="#00ff88"
    filter="url(#greenGlow)"
  />

</svg>